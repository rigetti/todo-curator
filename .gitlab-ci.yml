stages:
  - test
  - release
  - cli

workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      auto_cancel:
        on_new_commit: interruptible
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"

include:
  - project: "rigetti/qcs/utilities/qcs-ci-toolkit"
    file:
      - "gitlab-ci/gitlab/defaults.yaml"
      - "gitlab-ci/knope/lib.yaml"
  - project: "rigetti/qcs/utilities/rust-ci-image"
    file: "defaults/ci.yaml"

default:
  image: registry.gitlab.com/rigetti/qcs/utilities/rust-ci-image:latest
  tags:
    - default
  interruptible: true
  retry: !reference [.default_retry_policy]

check:
  extends: [.cargo_check]
  stage: test
  variables:
    KUBERNETES_CPU_REQUEST: 2

clippy:
  extends: [.cargo_clippy]
  stage: test

fmt:
  extends: [.rust_stable_sccache]
  stage: test
  script:
    - cargo fmt --check

test:
  extends: [.cargo_nextest]
  stage: test
  script:
    - cargo test

test-api-integration-github:
  extends: [.rust_stable_sccache]
  stage: test
  script:
    - cargo test --test api_integration_test --features test-integration-github --no-fail-fast
  variables:
    GH_TOKEN: $GITHUB_TOKEN

test-api-integration-gitlab:
  extends: [.rust_stable_sccache]
  stage: test
  script:
    - cargo test --test api_integration_test --features test-integration-gitlab --no-fail-fast
  variables:
    GITLAB_TOKEN: $GL_TOKEN

test-api-integration-combined:
  extends: [.rust_stable_sccache]
  stage: test
  script:
    - cargo test --test api_integration_test --features test-integration-github,test-integration-gitlab --no-fail-fast
  variables:
    GH_TOKEN: $GITHUB_TOKEN
    GITLAB_TOKEN: $GL_TOKEN

Dry run Knope release:
  extends: [.knope_dry_run]
  needs: []
  stage: release
  rules:
    - if: $CI_MERGE_REQUEST_IID

Knope release:
  extends: [.knope_release]
  needs: []
  stage: release

cli:build:
  stage: cli
  needs: []
  rules:
    - if: "$CI_COMMIT_MESSAGE =~ /^chore: prepare release/"
      # once a prerelease has been made, ensure artifacts are attached
      interruptible: false
    - when: manual
  parallel:
    matrix:
      - CLI_BUILD_IMAGE: macos-15-xcode-16
        CLI_BUILD_RUNNER_TAG: saas-macos-large-m2pro
      - CLI_BUILD_IMAGE: registry.gitlab.com/rigetti/qcs/utilities/rust-ci-image:latest
        CLI_BUILD_RUNNER_TAG: flexible
        KUBERNETES_CPU_REQUEST: 14
        KUBERNETES_MEMORY_LIMIT: 20Gi
      # Uncomment if we ever actually need a Windows version of the tool
      # - CLI_BUILD_IMAGE: windows-latest
      #   CLI_BUILD_RUNNER_TAG: saas-windows-medium-amd64
  tags: [$CLI_BUILD_RUNNER_TAG]
  image: $CLI_BUILD_IMAGE
  script:
    - scripts/ci_build_cli.py
  artifacts:
    paths:
      - release/

cli:release:
  stage: cli
  needs: [cli:build]
  # once a prerelease has been made, ensure artifacts are attached
  interruptible: false
  rules:
    - if: "$CI_COMMIT_MESSAGE =~ /^chore: prepare (pre)?release/"
  script:
    - CLI_VERSION="$(knope get-version)"
    - echo "Creating release with version ${CLI_VERSION}"
    - glab auth login --hostname gitlab.com --token "${GL_TOKEN}"
    - glab release create --use-package-registry "${CLI_VERSION}" release/* --name "todo-curator ${CLI_VERSION}" --notes-file CHANGELOG.md --ref "${CI_COMMIT_SHA}"
