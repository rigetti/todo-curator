[package]
versioned_files = [
    "Cargo.lock",
    "Cargo.toml",
]
changelog = "CHANGELOG.md"

[[workflows]]
name = "release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = 'git commit -m "chore: prepare release $version"'

[[workflows.steps]]
type = "Release"

[[workflows.steps]]
type = "Command"
# This must trigger the job to actually build the CLI binary and installers.
command = "git push"

[[workflows.steps]]
type = "Command"
# `-o ci.skip` is a GitLab push option, which GitHub does not accept.
command = "git push --tags"

[[workflows]]
name = "get-version"
help_text = "Get the current version of the project"

[[workflows.steps]]
type = "Command"
command = 'echo "$version"'
