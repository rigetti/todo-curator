[package]
versioned_files = [
    "Cargo.lock",
    "Cargo.toml",
]
changelog = "CHANGELOG.md"

# Assets are attached by the `publish-release` workflow below. Declaring them
# makes knope create the release as a draft, upload each asset, and publish
# only then — so the release is never visible without the binaries that make it
# installable.
assets = "release/*"

# Required for the Release step to publish to GitHub rather than only tagging.
[github]
owner = "rigetti"
repo = "todo-curator"

# Splitting the release in two is what lets those binaries exist by then: this
# half bumps the version and pushes, which triggers the cross-platform build.
[[workflows]]
name = "draft-release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = 'git commit -m "chore: prepare release $version"'

# Pushing the commit is what triggers cli-release.yml to build the binaries.
[[workflows.steps]]
type = "Command"
command = "git push"

# Run by cli-release.yml once the binaries are built and downloaded into
# ./release. Release creates the tag and the GitHub release, so nothing here
# pushes tags.
[[workflows]]
name = "publish-release"

[[workflows.steps]]
type = "Release"

[[workflows]]
name = "get-version"
help_text = "Get the current version of the project"

[[workflows.steps]]
type = "Command"
command = 'echo "$version"'
