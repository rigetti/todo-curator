[package]
versioned_files = [
    "Cargo.lock",
    "Cargo.toml",
]
changelog = "CHANGELOG.md"

# Without this, the `Release` step only creates a Git tag; declaring the forge
# makes it publish a GitHub release with the changelog entry as its notes.
# `cli-release.yml` then attaches the built binaries to that release.
[github]
owner = "rigetti"
repo = "todo-curator"

[[workflows]]
name = "release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = 'git commit -m "chore: prepare release $version"'

# The commit must reach the remote before Release runs: with a forge
# configured, Release creates the GitHub release through the API, and GitHub
# rejects a release whose target commit it has never seen. The push is also
# what triggers cli-release.yml to build the binaries.
[[workflows.steps]]
type = "Command"
command = "git push"

# Creates the tag as part of publishing the release, so there are no local tags
# left to push afterwards.
[[workflows.steps]]
type = "Release"

[[workflows]]
name = "get-version"
help_text = "Get the current version of the project"

[[workflows.steps]]
type = "Command"
command = 'echo "$version"'
