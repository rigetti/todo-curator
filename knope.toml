[package]
versioned_files = [
    "Cargo.lock",
    "Cargo.toml",
]
changelog = "CHANGELOG.md"

[[workflows]]
name = "release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = 'git commit -m "chore: prepare release $version"'

# Pushing the commit is what triggers cli-release.yml to build the binaries.
[[workflows.steps]]
type = "Command"
command = "git push"

# With no forge configured, this only creates a Git tag locally. That is
# deliberate: cli-release.yml publishes the GitHub release once the binaries
# exist, so a release is never visible without its assets. Publishing here
# instead would leave every consumer of `rigetti/todo-curator@vX.Y.Z` unable to
# install for the minutes the cross-platform build takes.
[[workflows.steps]]
type = "Release"

[[workflows.steps]]
type = "Command"
command = "git push --tags"

[[workflows]]
name = "get-version"
help_text = "Get the current version of the project"

[[workflows.steps]]
type = "Command"
command = 'echo "$version"'
