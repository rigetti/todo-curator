version: 2
updates:
  # Keeps the SHA pins current: Dependabot rewrites both the SHA and the
  # version comment, so pinning does not mean going stale unnoticed.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      # Run after any weekly GHA changes.
      day: "wednesday"
    groups:
      official:
        patterns:
          - "actions/*"
      rigetti:
        patterns:
          - "rigetti/*"
    cooldown:
      # `qcs-gha-infrastructure` is our own internal set of actions;
      # we therefore trust it and permit updates immediately.
      exclude:
        - "rigetti/qcs-gha-infrastructure"
