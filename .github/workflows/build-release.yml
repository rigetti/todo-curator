name: Build and publish a release

# Called by release.yml and prepare-prerelease.yml once the tag and its draft
# GitHub release exist: builds the binaries from the tag, attaches them, and
# only then undrafts the release, so a release is never visible without the
# binaries that make it installable.
#
# Safe to re-run: uploads overwrite. It refuses to modify a release that is not
# a draft, since that would change what users already installed.
on:
  workflow_call:
    inputs:
      tag:
        description: "The tag to build and publish; its draft release must exist."
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runs-on: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { runs-on: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { runs-on: macos-latest, target: aarch64-apple-darwin }
          - { runs-on: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      # Keep the path short: deep dependency trees overrun Windows' path limit.
      - name: Use a short target directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/t" >> "${GITHUB_ENV}"

      - name: Install Rust
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup toolchain install stable --profile minimal --target "${TARGET}"

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-linux-musl')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "${GITHUB_ENV}"

      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +stable build -p todo-curator --target "${TARGET}" --release

      - name: Stage the binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p release
          ext=""
          if [[ "${TARGET}" == *windows* ]]; then
            ext=".exe"
          fi
          cp "${CARGO_TARGET_DIR}/${TARGET}/release/todo-curator${ext}" \
             "release/todo-curator-${TARGET}${ext}"
          chmod +x release/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Attach the binaries and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ "$(gh release view "${TAG}" --repo "${REPO}" --json isDraft -q .isDraft)" != "true" ]]; then
            echo "::error::${TAG} is not a draft; refusing to modify it."
            exit 1
          fi
          ls -l release
          gh release upload "${TAG}" release/* --repo "${REPO}" --clobber
          # Keeps the prerelease flag the draft was created with.
          gh release edit "${TAG}" --repo "${REPO}" --draft=false
