name: Prepare release

# Dry-runs a release on every pull request and releases automatically when one
# merges. The release commit triggers cli-release.yml, which builds the binaries
# and attaches them to the GitHub release.
#
# For a release candidate cut from a branch, use prepare-prerelease.yml.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  prepare-release:
    uses: rigetti/qcs-gha-infrastructure/.github/workflows/prepare-release.yml@v0.2.1
    with:
      # The Release step runs later, from cli-release.yml, once the binaries
      # it attaches exist.
      knope-workflow: draft-release
    secrets:
      # A PAT or app token, not GITHUB_TOKEN: pushes made with GITHUB_TOKEN do
      # not trigger cli-release.yml.
      token: ${{ secrets.RELEASE_TOKEN }}
