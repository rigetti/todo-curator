name: Prepare release

# Manual. Run on `main` to open or update the release PR (version bump and
# changelog, from Conventional Commits) with `release-plz release-pr`.
# Releases are never started automatically.
#
# Events caused by GITHUB_TOKEN create no workflow runs (except
# `workflow_dispatch` and `repository_dispatch`), so the release PR gets no
# `pull_request` checks on its own. Close and reopen the PR: that starts the
# runs on its current head (`ci.yml` uses the default `pull_request` types,
# which include `reopened`). The strict required-checks ruleset means a PR that
# is behind `main` needs this again after any later push to `main`.
#
# Separately, runs held in `action_required` have been observed for a push to an
# existing PR branch (PR #54); that has not been observed for a newly opened
# release PR, so approve held runs if any appear.
#
# Then check the required checks pass, review, and merge.
# After merging, run release.yml on `main` immediately.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  release-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Refuse other branches
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Dispatch this on main."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ github.token }}
