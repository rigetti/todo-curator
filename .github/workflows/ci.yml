name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    uses: rigetti/qcs-gha-infrastructure/.github/workflows/rust-ci.yml@main
    with:
      # The API integration tests live in separate jobs below, because they
      # need forge credentials, so this job does not use --all-features.
      test-command: cargo nextest run

  knope-dry-run:
    if: github.event_name == 'pull_request'
    uses: rigetti/qcs-gha-infrastructure/.github/workflows/knope-dry-run.yml@main

  # Exercises action.yml end to end: ubi install, then a real check against a
  # fixture directory. Scanning the whole repository is not an option — this
  # repository's docs, tests, and source all discuss TODO patterns in prose,
  # which the checker correctly reads as malformed references.
  action:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        with:
          # The version input defaults to github.action_ref, which is empty for
          # a local `uses: ./`, so the latest release is named explicitly. This
          # tests the packaging, not this branch's binary.
          version: v0.1.12
          command: check-all
          path: data/self-test
          github-token: ${{ secrets.TODO_CURATOR_GH_TOKEN }}
          gitlab-token: ${{ secrets.TODO_CURATOR_GL_TOKEN }}

  # The credentialed API integration tests. This job only covers branches in
  # this repository, where the code is already trusted; pull requests from forks
  # are handled by api-integration-fork.yml, which requires a maintainer's
  # approval. Secrets are never available to `pull_request` runs from a fork, so
  # there is nothing to approve on this trigger.
  api-integration:
    name: api-integration (${{ matrix.name }})
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: github
            features: test-integration-github
          - name: gitlab
            features: test-integration-gitlab
          - name: combined
            features: test-integration-github,test-integration-gitlab
    uses: rigetti/qcs-gha-infrastructure/.github/workflows/rust-integration-tests.yml@main
    with:
      cache-key: api-integration
      test-command: >-
        cargo test --test api_integration_test
        --features ${{ matrix.features }} --no-fail-fast
    secrets:
      github-api-token: ${{ secrets.TODO_CURATOR_GH_TOKEN }}
      gitlab-api-token: ${{ secrets.TODO_CURATOR_GL_TOKEN }}
