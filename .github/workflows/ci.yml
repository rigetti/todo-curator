name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    uses: rigetti/qcs-gha-infrastructure/.github/workflows/rust-ci.yml@v0.4.0
    with:
      # The API integration tests live in separate jobs below, because they
      # need forge credentials, so this job does not use --all-features.
      test-command: cargo nextest run

  # Exercises action.yml end to end: ubi install, then a real check against a
  # fixture directory. Scanning the whole repository is not an option — this
  # repository's docs, tests, and source all discuss TODO patterns in prose,
  # which the checker correctly reads as malformed references.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # check-all resolves references against both forges, so it needs tokens,
      # and tokens are unavailable to fork pull requests (never passed) and to
      # Dependabot (which gets only Dependabot secrets). Those runs fall back to
      # check-invalid, which needs no credentials: less coverage, but it still
      # exercises the ubi install and the packaged action end to end — which is
      # exactly what a Dependabot bump to actions/checkout should be tested on.
      - name: Decide which check the credentials allow
        id: mode
        env:
          CREDENTIALED: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
        run: |
          set -euo pipefail
          if [[ "${CREDENTIALED}" == "true" ]]; then
            echo "command=check-all" >> "${GITHUB_OUTPUT}"
          else
            echo "No forge credentials for this event; running check-invalid."
            echo "command=check-invalid" >> "${GITHUB_OUTPUT}"
          fi

      # The version input defaults to github.action_ref, which is empty for a
      # local `uses: ./`. Resolving a release at run time keeps this from
      # rotting: a hardcoded tag silently keeps testing an old artifact after
      # every release. This tests the packaging, not this branch's binary.
      #
      # cli-release.yml publishes a release together with its binaries, so the
      # latest release should always have them. Check rather than assume: if it
      # does not, ubi reports only "could not find a release asset after
      # filtering for valid extensions" with an empty list, which is a poor
      # clue. Failing here says what is actually wrong.
      - name: Find the latest release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="$(gh release list --repo "${REPO}" --json tagName \
                   --exclude-pre-releases --exclude-drafts -q '.[0].tagName')"
          if [[ -z "${tag}" ]]; then
            echo "::error::No published release to test against."
            exit 1
          fi

          count="$(gh release view "${tag}" --repo "${REPO}" --json assets \
                     -q '[.assets[].name | select(startswith("todo-curator-"))] | length')"
          if [[ "${count}" -eq 0 ]]; then
            echo "::error::Release ${tag} has no todo-curator binaries attached; cli-release.yml should publish them with the release."
            exit 1
          fi

          echo "Testing against ${tag} (${count} binaries)"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - uses: ./
        with:
          version: ${{ steps.release.outputs.tag }}
          command: ${{ steps.mode.outputs.command }}
          path: data/self-test
          # Falls back to the job's own token so the ubi download is
          # authenticated even where the repository secrets are unavailable —
          # GitHub's unauthenticated API allows as few as 60 requests an hour.
          github-token: ${{ secrets.TODO_CURATOR_GH_TOKEN || github.token }}
          gitlab-token: ${{ secrets.TODO_CURATOR_GL_TOKEN }}

  # The credentialed API integration tests. This job only covers branches in
  # this repository, where the code is already trusted; pull requests from forks
  # are handled by api-integration-fork.yml, which requires a maintainer's
  # approval. Secrets are never available to `pull_request` runs from a fork, so
  # there is nothing to approve on this trigger.
  api-integration:
    name: api-integration (${{ matrix.name }})
    if: >-
      github.event_name == 'push'
      || github.event_name == 'workflow_dispatch'
      || (github.event.pull_request.head.repo.full_name == github.repository
          && github.actor != 'dependabot[bot]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: github
            features: test-integration-github
          - name: gitlab
            features: test-integration-gitlab
          - name: combined
            features: test-integration-github,test-integration-gitlab
    uses: rigetti/qcs-gha-infrastructure/.github/workflows/rust-integration-tests.yml@v0.4.1
    with:
      cache-key: api-integration
      test-command: >-
        cargo test --test api_integration_test
        --features ${{ matrix.features }} --no-fail-fast
    secrets:
      github-api-token: ${{ secrets.TODO_CURATOR_GH_TOKEN }}
      gitlab-api-token: ${{ secrets.TODO_CURATOR_GL_TOKEN }}

  # The single required status check. Everything above may legitimately skip —
  # forks have no secrets, Dependabot gets none either — and a skipped check
  # reads as neutral rather than passing, which would block those pull requests
  # forever if they were required individually.
  #
  # This job is required instead: it fails if any job failed or was cancelled,
  # and separately asserts that the credentialed jobs did run whenever they were
  # supposed to, so a broken `if` cannot pass the gate by skipping everything.
  ci-gate:
    name: CI gate
    if: always()
    needs: [rust, action, api-integration]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ toJSON(needs) }}
          # Whether the credentialed jobs were expected to run at all.
          CREDENTIALED_EXPECTED: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]') }}
        run: |
          set -euo pipefail
          echo "${RESULTS}" | jq .

          if ! echo "${RESULTS}" | jq -e 'all(.[].result; . == "success" or . == "skipped")' >/dev/null; then
            echo "::error::A required job failed or was cancelled."
            exit 1
          fi

          # The action self-test needs no credentials in its check-invalid mode,
          # so it has no excuse to skip on any event.
          if ! echo "${RESULTS}" | jq -e '.action.result == "success"' >/dev/null; then
            echo "::error::The action self-test did not run."
            exit 1
          fi

          if [[ "${CREDENTIALED_EXPECTED}" == "true" ]]; then
            if ! echo "${RESULTS}" | jq -e '.["api-integration"].result == "success"' >/dev/null; then
              echo "::error::The credentialed jobs were expected to run here but did not succeed."
              exit 1
            fi
          else
            echo "Credentialed jobs skipped: no secrets are available for this event."
          fi
