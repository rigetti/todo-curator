name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    uses: rigetti/qcs-gha-infrastructure/.github/workflows/rust-ci.yml@main
    with:
      # The API integration tests live in separate jobs below, because they
      # need forge credentials, so this job does not use --all-features.
      test-command: cargo nextest run

  knope-dry-run:
    if: github.event_name == 'pull_request'
    uses: rigetti/qcs-gha-infrastructure/.github/workflows/knope-dry-run.yml@main

  api-integration:
    # Only the GitHub half of the API integration suite runs in CI: this
    # repository has no GitLab credentials. The `test-integration-gitlab`
    # feature still works locally for anyone with a GitLab token.
    #
    # Secrets are not available to pull requests from forks, so this job is
    # skipped there rather than failing.
    if: github.event.pull_request.head.repo.full_name == github.repository || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rigetti/qcs-gha-infrastructure/actions/setup-rust@main
        with:
          cache-key: api-integration
      - name: Run API integration tests
        env:
          GH_TOKEN: ${{ secrets.TODO_CURATOR_GH_TOKEN }}
        run: |
          cargo test --test api_integration_test \
            --features test-integration-github --no-fail-fast
