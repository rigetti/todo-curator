name: Prepare prerelease

# Cuts a release candidate from the branch this is dispatched on, so it can be
# installed and tested before merging: bump, build, publish. Dispatching on
# main fails, since merging there releases automatically.
on:
  workflow_dispatch:
    inputs:
      prerelease-label:
        description: "Prerelease label; defaults to 'rc'."
        required: false
        default: ""

jobs:
  prerelease:
    uses: rigetti/qcs-gha-infrastructure/.github/workflows/rust-cli-prerelease.yml@v0.4.0
    with:
      bin: todo-curator
      prerelease-label: ${{ inputs.prerelease-label }}
    secrets:
      # A PAT or app token, not GITHUB_TOKEN: pushes made with GITHUB_TOKEN do
      # not trigger anything downstream.
      token: ${{ secrets.RELEASE_TOKEN }}
