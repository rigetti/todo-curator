name: Prepare prerelease

# Cuts a release candidate from the branch this is dispatched on, so it can be
# installed and tested before merging: version, build, publish. Uses only the
# job's own GITHUB_TOKEN. Dispatching on main fails, since main releases
# through the release PR (release.yml).
#
# The purpose of this flow is to let consumers use a version of the tool that
# includes unmerged work, for example to try a branch in another repository's
# CI before the change lands. It is not a release candidate of the next
# release: the tag points at the branch head, not at a release PR.
#
# release-plz has no prerelease flow of its own, so this computes the next
# version with `release-plz update`, appends `-<label>.<n>`, and tags a commit
# that exists only under that tag. Nothing is pushed to the branch: a bump
# commit on the branch would merge into `main` with a prerelease version in
# Cargo.toml, which release-plz would then release as the next version.
on:
  workflow_dispatch:
    inputs:
      prerelease-label:
        description: "Prerelease label; defaults to 'rc'."
        required: false
        default: ""

permissions:
  contents: read

env:
  RELEASE_PLZ_VERSION: "0.4.3"

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Refuse the default branch
        if: github.ref == 'refs/heads/main'
        run: |
          echo "::error::main releases through the release PR; dispatch this from the branch you want a release candidate for."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install release-plz
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download "release-plz-v${RELEASE_PLZ_VERSION}" \
            --repo release-plz/release-plz \
            --pattern 'release-plz-x86_64-unknown-linux-gnu.tar.gz' --dir "${RUNNER_TEMP}"
          tar -xzf "${RUNNER_TEMP}/release-plz-x86_64-unknown-linux-gnu.tar.gz" -C "${RUNNER_TEMP}"
          mkdir -p "${HOME}/.local/bin"
          install -m 0755 "$(find "${RUNNER_TEMP}" -name release-plz -type f | head -1)" "${HOME}/.local/bin/release-plz"
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: Bump, commit, and tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE_LABEL: ${{ inputs.prerelease-label }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          label="${PRERELEASE_LABEL:-rc}"

          # The next stable version, from the commits since the last release.
          # No changelog: a prerelease does not touch it.
          release-plz update --no-changelog
          base="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "todo-curator") | .version')"
          if git diff --quiet -- Cargo.toml; then
            echo "::error::No feat, fix, or breaking commit since the last release; release-plz would not bump the version."
            exit 1
          fi

          # Next free number for this base and label.
          last="$(git tag -l "v${base}-${label}.*" | sed -E 's/.*\.([0-9]+)$/\1/' | sort -n | tail -1)"
          version="${base}-${label}.$(( ${last:--1} + 1 ))"

          sed -i -E "0,/^version = \"[^\"]+\"/s//version = \"${version}\"/" Cargo.toml
          cargo update --workspace

          git config user.name "${ACTOR}"
          git config user.email "${ACTOR}@users.noreply.github.com"
          git commit -am "chore: prepare release ${version}"
          git tag "v${version}"
          git push origin "refs/tags/v${version}"
          echo "tag=v${version}" >> "${GITHUB_OUTPUT}"

  build:
    needs: draft
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runs-on: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { runs-on: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { runs-on: macos-latest, target: aarch64-apple-darwin }
          - { runs-on: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.draft.outputs.tag }}

      # Keep the path short: deep dependency trees overrun Windows' path limit.
      - name: Use a short target directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/t" >> "${GITHUB_ENV}"

      - name: Install Rust
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup toolchain install stable --profile minimal --target "${TARGET}"

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-linux-musl')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "${GITHUB_ENV}"

      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +stable build -p todo-curator --target "${TARGET}" --release

      - name: Stage the binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p release
          ext=""
          if [[ "${TARGET}" == *windows* ]]; then
            ext=".exe"
          fi
          cp "${CARGO_TARGET_DIR}/${TARGET}/release/todo-curator${ext}" \
             "release/todo-curator-${TARGET}${ext}"
          chmod +x release/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: release/
          if-no-files-found: error

  publish:
    needs: [draft, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true

      # Created as a draft and published after the upload, like a normal
      # release, so the prerelease is never visible without its binaries.
      - name: Create the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          set -euo pipefail
          ls -l release
          gh release create "${TAG}" release/* --repo "${REPO}" --verify-tag \
            --draft --prerelease --title "${TAG}" \
            --notes "Release candidate built from ${GITHUB_REF_NAME}."
          gh release edit "${TAG}" --repo "${REPO}" --draft=false --prerelease
