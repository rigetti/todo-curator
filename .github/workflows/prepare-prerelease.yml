name: Prepare prerelease

# Cuts a release candidate from the branch this is dispatched on, so it can be
# installed and tested before merging: version, build, publish. Uses only the
# job's own GITHUB_TOKEN. Dispatching on main fails, since main releases
# through the release PR (release.yml).
#
# The purpose of this flow is to let consumers use a version of the tool that
# includes unmerged work, for example to try a branch in another repository's
# CI before the change lands. It is not a release candidate of the next
# release: the tag points at the branch head plus a version bump commit,
# not at a release PR.
#
# release-plz has no prerelease flow of its own, so this computes the next
# version with `release-plz update`, appends `-<label>.<n>`, and tags a commit
# that exists only under that tag. Nothing is pushed to the branch: a bump
# commit on the branch would merge into `main` with a prerelease version in
# Cargo.toml, which release-plz would then release as the next version.
on:
  workflow_dispatch:
    inputs:
      prerelease-label:
        description: "Prerelease label"
        required: false
        default: rc

permissions:
  contents: read

# Two dispatches on one branch must not compute the same number.
concurrency:
  group: prepare-prerelease-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Refuse the default branch
        if: github.ref == 'refs/heads/main'
        run: |
          echo "::error::main releases through the release PR; dispatch this from the branch you want a release candidate for."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      # `release-plz/action` only runs `release-pr` or `release`; this needs
      # `release-plz update`. Keep the version in step with that action's.
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: release-plz@0.4.3

      - name: Bump, commit, and tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE_LABEL: ${{ inputs.prerelease-label }}
          ACTOR: ${{ github.triggering_actor }}
        run: |
          set -euo pipefail
          label="${PRERELEASE_LABEL}"
          if [[ ! "${label}" =~ ^[A-Za-z][0-9A-Za-z-]*$ ]]; then
            echo "::error::Invalid prerelease label '${label}': use letters, digits, and hyphens, starting with a letter."
            exit 1
          fi

          # A re-run of this dispatch (same run id) reuses its tag instead of
          # computing the next number. The run id is in the commit subject,
          # which `%(contents:subject)` shows for a lightweight tag.
          existing="$(git for-each-ref refs/tags --format='%(refname:short) %(contents:subject)' \
                        | grep -F "[run ${GITHUB_RUN_ID}]" | head -1 | cut -d' ' -f1 || true)"
          if [[ -n "${existing}" ]]; then
            echo "Reusing ${existing} from an earlier attempt of this run."
            tag="${existing}"
          else
            # Cargo.toml ahead of the latest release means a release PR was merged
            # but not released, or this is a release PR branch.
            current="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "todo-curator") | .version')"
            if ! git rev-parse -q --verify "refs/tags/v${current}" >/dev/null; then
              echo "::error::Cargo.toml is at ${current}, which has no release tag: a release PR is merged but not released, or this branch carries a release PR. Dispatch the Release workflow on main, or release through the release PR; a prerelease needs a version that is already released."
              exit 1
            fi

            # The next stable version, from the commits since the last release.
            # No changelog: a prerelease does not touch it.
            release-plz update --no-changelog
            base="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "todo-curator") | .version')"
            if git diff --quiet -- Cargo.toml; then
              echo "::error::No commit since the last release changes the package, so release-plz would not bump the version (it reports "already up to date"); there is nothing to prerelease."
              exit 1
            fi

            # Next free number for this base and label.
            last="$(git tag -l "v${base}-${label}.*" | sed -E 's/.*\.([0-9]+)$/\1/' | sort -n | tail -1)"
            version="${base}-${label}.$(( ${last:--1} + 1 ))"
            tag="v${version}"

            # Fails on a version that is not valid semver.
            release-plz set-version "${version}"

            # A local commit on top of the branch head, so the tagged tree's
            # Cargo.toml matches the binary's version. Only the tag is pushed.
            git config user.name "${ACTOR}"
            git config user.email "${ACTOR}@users.noreply.github.com"
            git commit -am "chore: prepare release ${tag} [run ${GITHUB_RUN_ID}]"
            git tag "${tag}"
            git push origin "refs/tags/${tag}"
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  build:
    needs: draft
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runs-on: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { runs-on: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { runs-on: macos-latest, target: aarch64-apple-darwin }
          - { runs-on: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.draft.outputs.tag }}

      # Keep the path short: deep dependency trees overrun Windows' path limit.
      - name: Use a short target directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/t" >> "${GITHUB_ENV}"

      - name: Install Rust
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup toolchain install stable --profile minimal --target "${TARGET}"

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-linux-musl')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "${GITHUB_ENV}"

      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +stable build -p todo-curator --target "${TARGET}" --release

      - name: Stage the binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p release
          ext=""
          if [[ "${TARGET}" == *windows* ]]; then
            ext=".exe"
          fi
          cp "${CARGO_TARGET_DIR}/${TARGET}/release/todo-curator${ext}" \
             "release/todo-curator-${TARGET}${ext}"
          chmod +x release/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: release/
          if-no-files-found: error

  publish:
    needs: [draft, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      # A draft first, published after the upload, like a normal release, so the
      # prerelease is never visible without its binaries. Safe to re-run: an
      # existing draft is reused, an already published prerelease is left alone.
      - name: Create the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.draft.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release create "${TAG}" --repo "${REPO}" --verify-tag \
              --draft --prerelease --title "${TAG}" \
              --notes "Release candidate built from ${GITHUB_REF_NAME}."
          fi
          if [[ "$(gh release view "${TAG}" --repo "${REPO}" --json isDraft -q .isDraft)" != "true" ]]; then
            echo "${TAG} is already published; nothing to do."
            exit 0
          fi
          ls -l release
          gh release upload "${TAG}" release/* --repo "${REPO}" --clobber
          gh release edit "${TAG}" --repo "${REPO}" --draft=false --prerelease
