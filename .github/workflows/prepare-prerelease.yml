name: Prepare prerelease

# Cuts a release candidate from the branch this is dispatched on, so it can be
# installed and tested before merging: bump, build, publish. Dispatching on
# main fails, since merging there releases automatically.
#
# EXPERIMENT: this inlines rust-cli-prerelease.yml from qcs-gha-infrastructure
# to test whether a prerelease works with only the job's own GITHUB_TOKEN.
# Pushes made with GITHUB_TOKEN start no new runs, so the `ci` job dispatches
# CI for the bump commit explicitly.
on:
  workflow_dispatch:
    inputs:
      prerelease-label:
        description: "Prerelease label; defaults to 'rc'."
        required: false
        default: ""

permissions:
  contents: read

env:
  KNOPE_VERSION: "0.23.0"

jobs:
  draft:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Refuse the default branch
        if: github.ref == 'refs/heads/main'
        run: |
          echo "::error::main releases automatically when merged to; dispatch this from the branch you want a release candidate for."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}

      - name: Install knope
        uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: ${{ env.KNOPE_VERSION }}

      # Repeated prereleases would otherwise accumulate changelog entries.
      - name: Reset the changelog to main
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin main
          git restore --source=FETCH_HEAD -- CHANGELOG.md

      - name: Configure git identity
        env:
          ACTOR: ${{ github.triggering_actor }}
        run: |
          git config --global user.name "${ACTOR}"
          git config --global user.email "${ACTOR}@users.noreply.github.com"

      - name: Prerelease
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PRERELEASE_LABEL: ${{ inputs.prerelease-label }}
        run: |
          set -euo pipefail
          label="${PRERELEASE_LABEL:-rc}"
          knope draft-release --verbose "--prerelease-label=${label}"

  build:
    needs: draft
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runs-on: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { runs-on: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { runs-on: macos-latest, target: aarch64-apple-darwin }
          - { runs-on: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.runs-on }}
    steps:
      # The branch, not the dispatched commit, which predates the bump.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}

      # Keep the path short: deep dependency trees overrun Windows' path limit.
      - name: Use a short target directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/t" >> "${GITHUB_ENV}"

      - name: Install Rust
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup toolchain install stable --profile minimal --target "${TARGET}"

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-linux-musl')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "${GITHUB_ENV}"

      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +stable build -p todo-curator --target "${TARGET}" --release

      - name: Stage the binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p release
          ext=""
          if [[ "${TARGET}" == *windows* ]]; then
            ext=".exe"
          fi
          cp "${CARGO_TARGET_DIR}/${TARGET}/release/todo-curator${ext}" \
             "release/todo-curator-${TARGET}${ext}"
          chmod +x release/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: release/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Install knope
        uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: ${{ env.KNOPE_VERSION }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: release
          merge-multiple: true

      - name: Publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ls -l release
          knope publish-release --verbose

  # `workflow_dispatch` is one of the few events that GITHUB_TOKEN can trigger,
  # so this restores the CI run that the bump commit's push did not start.
  ci:
    needs: draft
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch CI for the prerelease commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: gh workflow run ci.yml --repo "${REPO}" --ref "${BRANCH}"
