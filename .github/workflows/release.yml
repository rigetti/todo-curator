name: Release

# Manual. Run on `main` after the release PR (prepare-release.yml) is merged.
# Releases the version in Cargo.toml: `release-plz release` tags the commit and
# creates a draft GitHub release (with a squash or rebase merge it tags whatever
# `main` is now, not the release PR commit, so run this right after merging),
# then build-release.yml builds, attaches, and publishes.
#
# Safe to run again after a failure: an existing tag and draft are reused.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Refuse other branches
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Dispatch this on main, after the release PR is merged."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      # The tag is needed even when release-plz creates nothing: re-running
      # this job after release-plz tagged finds the tag and skips release-plz,
      # whose output then lists no release.
      - name: Determine the tag
        id: version
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "todo-curator") | .version')"
          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Tag and create the draft release
        if: steps.version.outputs.exists == 'false'
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Fails early and clearly if release-plz did not push the tag for its
      # draft (a draft release alone creates no tag), or if a tag exists
      # without a release (release-plz failed after tagging, or a hand-pushed
      # tag): `build` and `publish` need both.
      - name: Check the tag and release exist
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if ! gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::release-plz did not create ${TAG}."
            exit 1
          fi
          if ! gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "::error::${TAG} exists without a release; delete the tag and dispatch this workflow again."
            exit 1
          fi

  build-release:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/build-release.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
