name: Release

# Manual. Run on `main` after the release PR (prepare-release.yml) is merged.
# Releases the version in Cargo.toml: `release-plz release` tags the commit and
# creates a draft GitHub release, `build` compiles the binaries from the tag,
# and `publish` attaches them and only then undrafts the release, so a release
# is never visible without the binaries that make it installable.
#
# Safe to run again after a failure: an existing tag is reused, a missing draft
# is created, and uploads overwrite. It refuses a version that is already a
# published release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG_RE: '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(\.(0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*))?$'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Refuse other branches
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Dispatch this on main, after the release PR is merged."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Determine the tag and refuse a published release
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "todo-curator") | .version')"
          tag="v${version}"
          if [[ ! "${tag}" =~ ${TAG_RE} ]]; then
            echo "::error::'${tag}' is not a valid version tag."
            exit 1
          fi

          if out="$(gh release view "${tag}" --repo "${REPO}" --json isDraft -q .isDraft 2>/dev/null)" \
             && [[ "${out}" == "false" ]]; then
            echo "::error::${tag} is already a published release; merge a release PR with a new version first."
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            if ! git merge-base --is-ancestor "refs/tags/${tag}" HEAD; then
              echo "::error::${tag} exists but is not an ancestor of main."
              exit 1
            fi
            echo "exists=true" >> "${GITHUB_OUTPUT}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT}"
          fi
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Tag and create the draft release
        if: steps.version.outputs.exists == 'false'
        uses: release-plz/action@66b324fd6c72d05d2a08568492ecdd62bfb8a62b # v0.5.148
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Covers a tag whose release was never created, and checks release-plz
      # did what was asked.
      - name: Ensure the draft release exists
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh api "repos/${REPO}/git/ref/tags/${TAG}" >/dev/null 2>&1; then
            echo "::error::release-plz did not create ${TAG}."
            exit 1
          fi
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "Release ${TAG} exists."
          else
            awk -v v="${VERSION}" '/^## /{p=($2==v); next} p' CHANGELOG.md > "${RUNNER_TEMP}/notes.md"
            gh release create "${TAG}" --repo "${REPO}" --verify-tag --draft \
              --title "${TAG}" --notes-file "${RUNNER_TEMP}/notes.md"
          fi

  build:
    needs: release
    if: needs.release.outputs.tag != ''
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runs-on: ubuntu-latest, target: x86_64-unknown-linux-musl }
          - { runs-on: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { runs-on: macos-latest, target: aarch64-apple-darwin }
          - { runs-on: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.release.outputs.tag }}

      # Keep the path short: deep dependency trees overrun Windows' path limit.
      - name: Use a short target directory
        shell: bash
        run: echo "CARGO_TARGET_DIR=${RUNNER_TEMP}/t" >> "${GITHUB_ENV}"

      - name: Install Rust
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: rustup toolchain install stable --profile minimal --target "${TARGET}"

      - name: Install musl toolchain
        if: endsWith(matrix.target, '-linux-musl')
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          echo "CC_${TARGET//-/_}=musl-gcc" >> "${GITHUB_ENV}"

      - name: Build
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: cargo +stable build -p todo-curator --target "${TARGET}" --release

      - name: Stage the binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p release
          ext=""
          if [[ "${TARGET}" == *windows* ]]; then
            ext=".exe"
          fi
          cp "${CARGO_TARGET_DIR}/${TARGET}/release/todo-curator${ext}" \
             "release/todo-curator-${TARGET}${ext}"
          chmod +x release/*

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.target }}
          path: release/
          if-no-files-found: error

  publish:
    needs: [release, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Attach the binaries and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.release.outputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ${TAG_RE} ]]; then
            echo "::error::'${TAG}' is not a valid version tag."
            exit 1
          fi
          # Overwriting assets of a published release would change what users
          # already installed.
          if [[ "$(gh release view "${TAG}" --repo "${REPO}" --json isDraft -q .isDraft)" != "true" ]]; then
            echo "::error::${TAG} is not a draft; refusing to modify it."
            exit 1
          fi
          ls -l release
          gh release upload "${TAG}" release/* --repo "${REPO}" --clobber
          gh release edit "${TAG}" --repo "${REPO}" --draft=false
