name: CLI release

# Builds the todo-curator binary for each supported platform and attaches the
# results to the corresponding GitHub release.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    if: "startsWith(github.event.head_commit.message, 'chore: prepare release') || github.event_name == 'workflow_dispatch'"
    uses: rigetti/qcs-gha-infrastructure/.github/workflows/rust-cli-build.yml@main
    with:
      bin: todo-curator

  publish:
    needs: build
    # Only a release-preparation commit has a tag to attach binaries to.
    if: "startsWith(github.event.head_commit.message, 'chore: prepare release')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: rigetti/qcs-gha-infrastructure/actions/setup-knope@main
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Attach binaries to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(knope get-version)"
          # knope tags releases as vX.Y.Z; fall back to a bare version tag.
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            tag="v${version}"
          else
            tag="${version}"
          fi
          ls -l release
          # knope normally publishes the release itself; create it here if that
          # did not happen, so the binaries always have somewhere to land.
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "No release for ${tag} yet; creating one."
            gh release create "$tag" \
              --title "todo-curator ${version}" \
              --notes-file CHANGELOG.md \
              --target "${GITHUB_SHA}"
          fi
          gh release upload "$tag" release/* --clobber
