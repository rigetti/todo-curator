name: CLI release

# The second half of a release: builds the binaries and runs knope's Release
# step over them. knope.toml's `draft-release` workflow, run on merge to main,
# only bumps and pushes — that push is what triggers this.
#
# Splitting it that way is what keeps a release from ever being visible without
# the binaries that make it installable; see rust-cli-release.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  release:
    uses: rigetti/qcs-gha-infrastructure/.github/workflows/rust-cli-release.yml@v0.4.2
    with:
      bin: todo-curator
    secrets:
      # A PAT rather than GITHUB_TOKEN, so publishing the release can trigger
      # any workflow that watches for it.
      token: ${{ secrets.RELEASE_TOKEN }}
