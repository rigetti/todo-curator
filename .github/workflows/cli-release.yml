name: CLI release

# Builds the todo-curator binary for each supported platform, then publishes
# the GitHub release with those binaries attached.
#
# knope deliberately does not publish the release itself: it only tags. A
# release that exists without its assets cannot be installed, and ubi reports
# it as "could not find a release asset after filtering for valid extensions".
# Publishing here means the release and its binaries appear together.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    if: "startsWith(github.event.head_commit.message, 'chore: prepare release') || github.event_name == 'workflow_dispatch'"
    uses: rigetti/qcs-gha-infrastructure/.github/workflows/rust-cli-build.yml@v0.1.1
    with:
      bin: todo-curator

  publish:
    needs: build
    # Only a release-preparation commit has a tag to attach binaries to.
    if: "startsWith(github.event.head_commit.message, 'chore: prepare release')"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install knope
        uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          # Test before updating, breaking changes likely:
          # https://github.com/knope-dev/action#install-latest-version
          version: 0.23.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          merge-multiple: true
      - name: Publish the release with its binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(knope get-version)"
          # knope tags releases as vX.Y.Z; fall back to a bare version tag.
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            tag="v${version}"
          else
            tag="${version}"
          fi
          ls -l release

          # Just this version's entry, not the whole changelog: everything from
          # the first `## ` heading up to the next one.
          awk '/^## /{ if (seen) exit; seen = 1; next } seen' CHANGELOG.md \
            > "${RUNNER_TEMP}/notes.md"
          echo "--- release notes ---"
          cat "${RUNNER_TEMP}/notes.md"

          # A semver prerelease carries a hyphenated suffix: 0.1.15-rc.0. Mark
          # it as such, or GitHub serves it as "latest" and every consumer
          # asking for the newest release gets a release candidate.
          # Expanded below as ${flags[@]+"${flags[@]}"}: under `set -u`, a bare
          # "${flags[@]}" on an empty array is an unbound variable in bash 3.2.
          # This job runs on bash 5, where it is fine, but the portable form
          # costs nothing.
          flags=()
          case "${version}" in
            *-*) echo "Prerelease: ${version}"; flags+=(--prerelease) ;;
            *)   echo "Full release: ${version}" ;;
          esac

          # Create the release and its assets in one call, so it is never
          # visible in an unusable, assetless state. On a re-run the release
          # already exists, so upload into it instead.
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "Release ${tag} already exists; uploading into it."
            gh release upload "${tag}" release/* --clobber
          else
            gh release create "${tag}" release/* \
              --title "todo-curator ${version}" \
              --notes-file "${RUNNER_TEMP}/notes.md" \
              --target "${GITHUB_SHA}" \
              ${flags[@]+"${flags[@]}"}
          fi
