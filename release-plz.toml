# See https://release-plz.dev/docs/config.
[workspace]
# The crate is not on crates.io: take the current version from git tags and
# never run `cargo publish`.
# Without this, `publish = false` in `Cargo.toml` makes release-plz skip the
# package entirely.
git_only = true
# TODO(#58): use semver-checks if we publish to crates.io
semver_check = false

# `release-plz release` creates the tag and the GitHub release as a draft.
# release.yml uploads the binaries and only then publishes the draft, so a
# release is never visible without the binaries that make it installable.
git_release_draft = true
git_release_type = "auto"

# release.yml decides when to release (a merged release PR, or a dispatch to
# recover from a failure), so release whatever version in `Cargo.toml` has no
# tag yet. `release_always = false` would instead require the checked-out
# commit to be a release PR merge, which a recovery dispatch on a later `main`
# is not.
release_always = true

pr_labels = ["release"]
